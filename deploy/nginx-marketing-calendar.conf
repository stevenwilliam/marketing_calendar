# marketing_calendar — nginx reverse proxy.
#
# NOT PUBLIC FACING (D17, N1). nginx binds the internal network with an IP
# allowlist and the Go service binds loopback only, so nginx is the only way
# in. Copy to /etc/nginx/sites-available/marketing-calendar and symlink.

upstream marketing_calendar {
    server 127.0.0.1:8093;
    keepalive 16;
}

# Rate limit the authentication endpoints at the edge as well as in the
# application. Two limits in series is deliberate: the application limiter
# protects an account, this one protects the box.
limit_req_zone $binary_remote_addr zone=mc_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;

    # Port 8094 as well, and this is the one people actually use on the dev
    # server. `ruuma` owns `listen 80 default_server`, so a request to the bare
    # IP on port 80 lands there, not here — the hostname below is the only way
    # in on 80, and it is not in DNS. Being the sole listener on 8094 makes
    # http://<server-ip>:8094/ reach this application with no DNS at all,
    # which is the same shape evermore uses on 8090/8091.
    #
    # In production, delete the 8094 lines: the hostname will resolve, TLS will
    # be on 443, and a second unencrypted door is not wanted.
    listen 8094;
    listen [::]:8094;

    server_name marketing-calendar.sfg.local _;

    # --- who may reach this at all -------------------------------------
    # The office network and the VPN range. EVERY other source is refused
    # before a request ever reaches the application.
    # CONFIRM THESE RANGES WITH STEVEN before this goes to production.
    allow 127.0.0.1;
    allow 192.168.88.0/24;   # dev server LAN
    # allow 10.8.0.0/24;     # VPN — uncomment once the range is confirmed
    deny all;

    # --- TLS -----------------------------------------------------------
    # In production this server block listens on 443 with certbot's
    # certificate and redirects 80 -> 443. See docs/09-deployment.md; it is
    # left as HTTP here because the dev server has no certificate for an
    # internal hostname.

    client_max_body_size 64m;   # matches the importer's upload cap

    # Security headers. The application sets its own too; these survive even
    # if a response bypasses the Go middleware.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    server_tokens off;

    access_log /var/log/nginx/marketing-calendar.access.log;
    error_log  /var/log/nginx/marketing-calendar.error.log;

    location /api/v1/auth/ {
        limit_req zone=mc_auth burst=5 nodelay;
        proxy_pass http://marketing_calendar;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Metrics are for Prometheus on this host, never for a browser.
    location /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://marketing_calendar;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://marketing_calendar;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
